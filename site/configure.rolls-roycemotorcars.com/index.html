     * @param {string} tagName - The name of the tag to be created.
     * @param {object} attributes - Key value pairs of html attributes to be set.
     */
    function loadTag(tagName, attributes) {
      let tag = `<${tagName}`;
      Object.keys(attributes).forEach(value => {
        if (value === 'disabled' && (!attributes[value] || attributes[value] === 'false')) {
          return;
        }
        tag += ` ${value}="${attributes[value]}" `;
      });
      tag += `></${tagName}>`;

  <!-- ES6 support check -->
  <script>
    /**
     * Checks if ES6 is supported.
     * @return {boolean} Returns true if ES6 is supported.
     */
    function checkES6() {
      if (typeof Symbol === 'undefined' || typeof fetch === 'undefined') {
        return false;
      }
      try {
        eval('class Foo{}');
        eval('var bar = (x) => x+1');
      } catch (e) {
        return false;
      }
      return true;
    }

    function isBrowserUpdateRequired() {
      const minBrowserVersionSetting = { Safari: 11, Edge: 81 };

      const { userAgent } = navigator;
      let browserName;
      let fullVersion;
      let verOffset;
      if ((verOffset = userAgent.indexOf('Edge')) != -1) {
        browserName = 'Edge';
        fullVersion = userAgent.substring(verOffset + 5);
      } else if ((verOffset = userAgent.indexOf('Chrome')) != -1) {
        browserName = 'Chrome';
        fullVersion = userAgent.substring(verOffset + 7);
      } else if ((verOffset = userAgent.indexOf('Safari')) != -1) {
        browserName = 'Safari';
        fullVersion = userAgent.substring(verOffset + 7);
        if ((verOffset = userAgent.indexOf('Version')) != -1) fullVersion = userAgent.substring(verOffset + 8);
      } else if ((verOffset = userAgent.indexOf('Firefox')) != -1) {
        browserName = 'Firefox';
        fullVersion = userAgent.substring(verOffset + 8);
      }

      if (browserName && fullVersion && minBrowserVersionSetting[browserName] &&
        fullVersion < (`${minBrowserVersionSetting[browserName]}`)) {
        return true;
      }
      return false;
    }

    if (!checkES6() || isBrowserUpdateRequired()) {
      window.location.href = 'error.html';
    }
  </script>

  <!-- Fetch interceptor: append .json extension for API calls served as static files -->
  <script>
    (function() {
      var _originalFetch = window.fetch;
      window.fetch = function(url, opts) {
        var urlStr = (typeof url === 'string') ? url : (url && url.url ? url.url : '');

        // Block external tracking/analytics domains
        var blocked = ['tron.bmwgroup.com', 'assets.adobedtm.com', 'bmw.com/epaas', 'bmw.com/p15r',
                       'evergage.com', 'go-mpulse.net', 'akamaihd.net', 'consentcontroller'];
        for (var i = 0; i < blocked.length; i++) {
          if (urlStr.indexOf(blocked[i]) !== -1) {
            return Promise.resolve(new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
          }
        }

        // Rewrite api.visualiser / visualiser URLs to local paths
        if (urlStr.indexOf('api.visualiser.rolls-roycemotorcars.com') !== -1) {
          var apiPath = urlStr.replace(/https?:\/\/api\.visualiser\.rolls-roycemotorcars\.com/, '/rolls-royce-demo/configure.rolls-roycemotorcars.com');
          // Append .json if no extension
          if (apiPath.match(/\/[^.\/]+$/) || apiPath.match(/\/$/)) {
            apiPath = apiPath.replace(/\/$/, '') + '.json';
          }
          return _originalFetch.call(window, apiPath, opts);
        }

        if (urlStr.indexOf('visualiser.rolls-roycemotorcars.com') !== -1) {
          var visPath = urlStr.replace(/https?:\/\/visualiser\.rolls-roycemotorcars\.com/, '/rolls-royce-demo/configure.rolls-roycemotorcars.com');
          if (visPath.match(/\/[^.\/]+$/) || visPath.match(/\/$/)) {
            visPath = visPath.replace(/\/$/, '') + '.json';
          }
          return _originalFetch.call(window, visPath, opts);
        }

        // For local API-style paths without extensions, try appending .json
        if (urlStr.indexOf('/rolls-royce-demo/') !== -1 && urlStr.match(/\/[^.\/]+$/) &&
            !urlStr.match(/\.(js|css|json|html|png|jpg|svg|woff2|ico)$/)) {
          var jsonUrl = urlStr + '.json';
          return _originalFetch.call(window, jsonUrl, opts).then(function(resp) {
            if (resp.ok) return resp;
            return _originalFetch.call(window, url, opts);
          }).catch(function() {
            return _originalFetch.call(window, url, opts);
          });
        }

        return _originalFetch.call(window, url, opts);
      };
    })();
  </script>

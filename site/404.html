<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rolls-Royce Demo - Page Not Found</title>
<script>
  // SPA routing for GitHub Pages
  // GitHub Pages serves this 404.html for any path that doesn't match a static file.
  // For configurator deep-link URLs, redirect to the SPA shell and let the
  // client-side router handle the path.
  var path = location.pathname;
  var configPrefix = '/rolls-royce-demo/configure.rolls-roycemotorcars.com/';

  if (path.indexOf(configPrefix) === 0) {
    // Store the full URL so the SPA can restore it
    sessionStorage.setItem('spa-redirect', path + location.search + location.hash);
    location.replace(configPrefix);
  }
  // For other unknown paths, just show a simple 404 message
</script>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: #1a1a1a;
    color: #fff;
  }
  .container {
    text-align: center;
  }
  h1 { font-size: 3em; margin-bottom: 0.2em; }
  p { color: #999; }
  a { color: #c4a35a; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Page not found</p>
    <p><a href="/rolls-royce-demo/www.rolls-roycemotorcars.com/en_GB/home.html">Return to Rolls-Royce Demo Home</a></p>
  </div>
</body>
</html>
